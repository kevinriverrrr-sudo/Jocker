<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)"/>
  
  <!-- Chart icon -->
  <g transform="translate(32, 40)">
    <!-- Bar 1 -->
    <rect x="0" y="30" width="12" height="18" fill="white" opacity="0.9" rx="2"/>
    <!-- Bar 2 -->
    <rect x="18" y="20" width="12" height="28" fill="white" opacity="0.9" rx="2"/>
    <!-- Bar 3 -->
    <rect x="36" y="10" width="12" height="38" fill="white" opacity="0.9" rx="2"/>
    <!-- Bar 4 -->
    <rect x="54" y="5" width="12" height="43" fill="white" opacity="0.9" rx="2"/>
  </g>
  
  <!-- Dollar sign -->
  <text x="64" y="90" font-size="32" fill="white" font-weight="bold" text-anchor="middle" font-family="Arial">$</text>
</svg>
